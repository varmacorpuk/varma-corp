# Optional Postgres for when Docker is available.
# This box currently uses TEMPORARY SQLite via StoragePort if Docker is absent.
# Do not treat compose as production deployment.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: varma
      POSTGRES_PASSWORD: varma
      POSTGRES_DB: varma
    ports:
      - "5432:5432"
    volumes:
      - varma_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U varma"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  varma_pg:
